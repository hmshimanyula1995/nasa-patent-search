# Weekly pull requests for the three places a vulnerability can enter:
# the base image digest, the pinned Python packages, and the GitHub Actions.
# Merge the PR, then run the "Deploy to Cloud Run" workflow to ship it.
version: 2
updates:
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
