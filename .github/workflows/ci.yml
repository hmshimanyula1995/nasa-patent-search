name: CI

# Runs the test suite, builds the container image, checks that it starts, and
# fails on any fixable critical/high vulnerability. The weekly schedule makes
# newly published CVEs surface as a failed run even when nothing was committed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install pinned dependencies and test tooling
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  image:
    name: Build, start and scan the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nasa-patent-search:ci ./app

      - name: Start container and wait for the Streamlit health endpoint
        run: |
          docker run -d --name app -p 8080:8080 -e GOOGLE_CLOUD_PROJECT=ci nasa-patent-search:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/_stcore/health 2>/dev/null | grep -q ok; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy:" >&2
          docker logs app >&2
          exit 1

      - name: Fail on fixable critical or high vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            nasa-patent-search:ci

      - name: Report every critical or high finding, fixable or not
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --scanners vuln --severity CRITICAL,HIGH --exit-code 0 \
            nasa-patent-search:ci
