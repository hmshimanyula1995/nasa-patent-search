name: CI

# Runs the test suite, builds the container image, proves the app imports and
# starts inside it, and fails on any fixable critical/high vulnerability. The
# weekly schedule makes newly published CVEs surface as a failed run even when
# nothing was committed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install pinned dependencies and test tooling
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  image:
    name: Build, verify and scan the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t nasa-patent-search:ci ./app

      - name: Run the test suite inside the Alpine build stage
        # Same musl wheels as production. The build stage keeps a system pip,
        # so pytest can be added without touching the pinned virtualenv.
        run: |
          docker build --target builder -t nasa-patent-search:builder ./app
          docker run --rm \
            -v "$PWD/app:/src:ro" -w /src \
            -e GOOGLE_CLOUD_PROJECT=ci -e PYTHONDONTWRITEBYTECODE=1 -e PIP_ROOT_USER_ACTION=ignore \
            nasa-patent-search:builder \
            sh -c 'pip install -q --target /tmp/pt pytest==8.4.2 && PYTHONPATH=/tmp/pt /opt/venv/bin/python -m pytest -q -p no:cacheprovider'

      - name: Import the app inside the runtime image
        run: |
          docker run --rm --entrypoint python -e GOOGLE_CLOUD_PROJECT=ci nasa-patent-search:ci -c \
            "import utils.bigquery_client, utils.gemini_client, utils.graph_ranking, utils.graph, utils.charts, utils.refresh, scipy.sparse, pyarrow; print('imports ok')"

      - name: Start container and wait for the Streamlit health endpoint
        run: |
          docker run -d --name app -p 8080:8080 -e GOOGLE_CLOUD_PROJECT=ci nasa-patent-search:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/_stcore/health 2>/dev/null | grep -q ok; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy:" >&2
          docker logs app >&2
          exit 1

      - name: Fail on fixable critical or high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nasa-patent-search:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Report every critical or high finding, fixable or not
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nasa-patent-search:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'
